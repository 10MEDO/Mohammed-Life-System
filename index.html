<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Mohammed Life System">
  <title>Mohammed Life System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">M</div><div><b>Mohammed</b><span>Life System</span></div></div>
    <nav id="nav">
      <button class="nav active" data-view="today">Today</button>
      <button class="nav" data-view="planner">Planner</button>
      <button class="nav" data-view="health">Health</button>
      <button class="nav" data-view="study">Study</button>
      <button class="nav" data-view="finance">Finance</button>
      <button class="nav" data-view="history">History</button>
      <button class="nav" data-view="analytics">Analytics</button>
    </nav>
    <div class="side-actions">
      <button id="lang" class="secondary">العربية</button>
      <button id="export" class="secondary">Export data</button>
      <label class="secondary file">Import data<input id="import" type="file" accept="application/json" hidden></label>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div><small id="date"></small><h1 id="title">Today</h1></div>
      <div class="day-controls">
        <button id="prev">←</button><button id="jump">Today</button><button id="next">→</button>
      </div>
    </header>
    <div id="app"></div>
  </main>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
